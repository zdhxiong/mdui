<!doctype html>
<html lang="zh">

<head>
  <title>Accessible</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Two+Tone|Material+Icons+Round|Material+Icons+Sharp"
    rel="stylesheet">
  <style>
    body {
      font-family: Roboto;
    }

    mdui-card {
      width: 100px;
      height: 61.8px;
    }
  </style>
  <script type="module">
    import '../../packages/mdui/mdui.css';
    import '../../packages/mdui/components/icon.js';
  </script>
</head>

<body>
<main>
  <section>
    <h2>focusElement === this</h2>
    <mdui-icon name="settings"></mdui-icon>
    <mdui-icon name="settings" accessible-label="accessible label"></mdui-icon>
    <mdui-icon name="settings" accessible-description="accessible description"></mdui-icon>
    <mdui-icon name="settings" accessible-labelledby="label-2 label-1"></mdui-icon>
    <mdui-icon name="settings" accessible-describedby="label-2 label-1"></mdui-icon>
    <mdui-icon name="settings" accessible-label="accessible label" accessible-labelledby="label-2 label-1"></mdui-icon>
    <mdui-icon name="settings" accessible-description="accessible description" accessible-describedby="label-2 label-1"></mdui-icon>

    <div id="label-1" style="display: none">label-1</div>
    <div id="label-2" style="display: none">label-2</div>
  </section>

</main>
</body>

</html>
